<!DOCTYPE html>

<html>
    <head>
        <style>
            nav ul {
                list-style: none;
            }
            h1 {
                text-align: center;
            }
            p {
                text-align: center;
            }

            div {
                text-align: center;
            }
        </style>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h1>ml5.jsを利用した骨格認識と顔認識と手認識</h1>
        <p>Webカメラから顔のメッシュと手の形を推論</p>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>　<!--p5.jsライブラリのインポート-->
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/addons/p5.dom.min.js"></script>
        <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script> <!--ml5.jsライブラリのインポート-->
    </head>
    <body>
        <nav>
        <ul>
        <li>
            <div id="canvas"></div>
        <script>
            let faceMesh; //顔メッシュの定義
            let faces = [];
            let options = { maxFaces: 1, refineLandmarks: false, flipHorizontal: false };
            let handPose; //手認識の定義
            let video;
            let hands = [];
            let bodyPose; //骨格認識の定義
            let poses = [];
            let connections;

            function preload() {
            faceMesh = ml5.faceMesh(options); //顔メッシュライブラリの読み込み
            handPose = ml5.handPose(); //手認識ライブラリの読み込み
            bodyPose = ml5.bodyPose(); //骨格認識ライブラリの読み込み
            }

            function setup() {
            let canvas = createCanvas(640, 480);
            canvas.parent('canvas');
            // Create the webcam video and hide it
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide();
            // start detecting hands from the webcam video
            faceMesh.detectStart(video, gotFaces);
            handPose.detectStart(video, gotHands);
            bodyPose.detectStart(video, gotPoses);

            connections = bodyPose.getSkeleton();
            }

            function draw() {
            // webカメラから読み込んだ顔、手、骨格の位置を描写する
            image(video, 0, 0, width, height);

            for (let i = 0; i < faces.length; i++) {
                let face = faces[i];
                for (let j = 0; j < face.keypoints.length; j++) {
                let keypoint = face.keypoints[j];
                fill(0, 255, 0);
                noStroke();
                circle(keypoint.x, keypoint.y, 5); //顔メッシュは丸で表示
                }
            }
            // Draw all the tracked hand points
            for (let i = 0; i < hands.length; i++) {
                let hand = hands[i];
                for (let j = 0; j < hand.keypoints.length; j++) {
                let keypoint = hand.keypoints[j];
                fill(0, 255, 0);
                noStroke();
                rect(keypoint.x, keypoint.y, 10); //手は四角で表示
                }
            }
            for (let i = 0; i < poses.length; i++) {
                let pose = poses[i];
                for (let j = 0; j < connections.length; j++) {
                let pointAIndex = connections[j][0];
                let pointBIndex = connections[j][1];
                let pointA = pose.keypoints[pointAIndex];
                let pointB = pose.keypoints[pointBIndex];

                if (pointA.confidence > 0.1 && pointB.confidence > 0.1) {
                    stroke(255, 0, 0);
                    strokeWeight(2);
                    line(pointA.x, pointA.y, pointB.x, pointB.y);
                }
                }
             }

             for (let i = 0; i < poses.length; i++) {
                let pose = poses[i];
                for (let j = 0; j < pose.keypoints.length; j++) {
                let keypoint = pose.keypoints[j];
               
                if (keypoint.confidence > 0.1) {
                    fill(0, 255, 0);
                    noStroke();
                    circle(keypoint.x, keypoint.y, 10);
                }
                }
            }
            }
            
            function gotHands(results) {
            
            hands = results;
            }
            
            function gotFaces(results) {
            
            faces = results;
            }

            function gotPoses(results) {
                poses = results;
            }
        </script>
        </li>
        <li>
          <p>使用したライブラリ</p>
          <p><a href = "https://docs.ml5js.org/#/reference/bodypose">ml5.js BodyPose</a>　<a href = "https://docs.ml5js.org/#/reference/handpose">ml5.js HandPose</a>　<a href = "https://docs.ml5js.org/#/reference/facemesh">ml5.js FaceMesh</a></p>
          </li>
          </ul>
          </nav>
    </body>
</html>
